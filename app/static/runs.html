<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Запуски - Qalqan</title>
  <link rel="icon" type="image/png" href="/static/afmlogo.png?v=20260720-qalqan">
  <link rel="stylesheet" href="/static/styles.css?v=20260830-live-run">
</head>
<body data-page="runs">
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/monitor" aria-label="Qalqan"><strong>Qalqan</strong></a>
      <nav class="topnav" aria-label="Разделы">
        <a href="/monitor">Поиск</a>
        <a href="/monitor#trendPanel">Динамика</a>
        <a href="/monitor#auditPanel">Журнал</a>
        <a href="/registry">Реестр</a>
        <a class="active" href="/runs" aria-current="page">Запуски</a>
      </nav>
      <div class="health">
        <button id="healthToggle" class="health-toggle" type="button" aria-expanded="false" aria-controls="healthDetails">
          <span>Состояние</span><i aria-hidden="true"></i>
        </button>
        <div id="healthDetails" class="health-details" hidden>
          <div class="health-pills">
            <span id="kzAccessPill" class="health-pill">KZ: проверка</span>
            <span id="geminiPill" class="health-pill">AI: проверка</span>
          </div>
          <p id="healthLine" class="health-summary">Проверяю готовность платформы...</p>
        </div>
      </div>
    </header>

    <main class="workspace page-workspace">
      <section class="run-findings-band">
        <div class="section-head">
          <div>
            <span class="eyebrow">Архив запусков</span>
            <h1 class="page-title">Домены по запускам</h1>
          </div>
          <span id="runFoldersCount" class="summary-pill">0 запусков</span>
        </div>
        <div id="runFoldersList" class="run-folders-list">
          <div class="empty-state">Загрузка запусков...</div>
        </div>
      </section>
    </main>
  </div>

  <div id="drawerOverlay" class="drawer-overlay" hidden>
    <aside class="analysis-drawer" aria-label="Анализ домена">
      <div class="drawer-head">
        <div><span class="eyebrow">Анализ домена</span><h2 id="drawerTitle">Домен</h2></div>
        <button id="drawerClose" class="icon-btn" type="button" aria-label="Закрыть">×</button>
      </div>
      <div id="caseDetailContent" class="case-detail-content"></div>
    </aside>
  </div>

  <div id="authOverlay" class="auth-overlay" hidden>
    <form id="authForm" class="auth-box">
      <span class="eyebrow">Доступ к API</span>
      <h2>Введите ADMIN_TOKEN</h2>
      <p id="authHint">Токен нужен для просмотра архива запусков.</p>
      <label for="apiTokenInput">API token</label>
      <input id="apiTokenInput" type="password" autocomplete="current-password" placeholder="Bearer token">
      <div class="auth-actions">
        <button class="primary-btn" type="submit">Сохранить</button>
        <button id="clearTokenBtn" class="secondary-btn" type="button">Сбросить</button>
      </div>
    </form>
  </div>

  <script src="/static/app.js?v=20260830-live-run"></script>
</body>
</html>
